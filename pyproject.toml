[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "gmldf"
version = "0.1.0a1"
description = "Configuration-driven data and machine learning workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.14.3,<3", "PyYAML>=6.0.3,<7"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3", "build==1.6.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/gmldf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["integration: requires explicitly selected provider or host environment"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
